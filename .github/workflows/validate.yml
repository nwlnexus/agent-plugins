name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install shellcheck and PyYAML
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck python3-yaml
      - name: Validate skills, agents, fragments and templates
        run: sh scripts/validate-skills.sh
      - name: Validate the plugin and marketplace (claude plugin validate --strict)
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude plugin validate . --strict
      - name: Session-contract hook emits SessionStart and SubagentStart context
        run: |
          echo '{}' | CLAUDE_PLUGIN_ROOT="$PWD" sh hooks/session-contract.sh \
            | jq -e '.hookSpecificOutput.hookEventName == "SessionStart" and (.hookSpecificOutput.additionalContext | startswith("## Session contract"))'
          echo '{}' | CLAUDE_PLUGIN_ROOT="$PWD" sh hooks/session-contract.sh SubagentStart \
            | jq -e '.hookSpecificOutput.hookEventName == "SubagentStart" and (.hookSpecificOutput.additionalContext | startswith("## Session contract"))'
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@07035fd053f7be764496c0f8d8f9f41f98305101 # v22.0.0
        with:
          globs: '**/*.md'
